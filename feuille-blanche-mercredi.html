<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feuille Blanche : Mercredi · Bloc 4</title>
<style>
:root{--c:#2E7D32;--cd:#1B5E20;--cl:#E8F5E9;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1a1a2e;min-height:100vh;}
.hdr{background:linear-gradient(135deg,var(--cd),var(--c));color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.hdr-l{display:flex;align-items:center;gap:.8rem;}
.back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:.35rem .8rem;border-radius:7px;font-size:.8rem;font-weight:600;text-decoration:none;}
.htitle{font-size:1rem;font-weight:800;}
.hsub{font-size:.74rem;opacity:.8;margin-top:.1rem;}
.hdr-r{display:flex;align-items:center;gap:.8rem;}
.schip{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:50px;padding:.3rem .9rem;font-size:.85rem;font-weight:800;display:none;}
.timer{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;}
.tbtn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:.3rem .6rem;border-radius:6px;font-size:.8rem;cursor:pointer;}
.tbtn:hover{background:rgba(255,255,255,.35);}
.body{max-width:820px;margin:0 auto;padding:1.2rem 1.5rem 3rem;}
.intro{background:#fff;border-left:4px solid var(--c);border-radius:10px;padding:.9rem 1.1rem;font-size:.85rem;line-height:1.7;margin-bottom:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.intro strong{color:var(--cd);}
.sec{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c);border-left:3px solid var(--c);padding-left:.6rem;margin:1.8rem 0 .9rem;}
.qcard{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:1rem;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1.5px solid #e5eaf0;transition:border .2s;}
.qcard.verified{border-color:var(--c);}
.qlbl{font-size:.65rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem;}
.qtxt{font-size:.97rem;font-weight:600;line-height:1.5;margin-bottom:.8rem;}
textarea{width:100%;min-height:85px;border:1.5px solid #d5dde8;border-radius:8px;padding:.65rem .85rem;font-family:inherit;font-size:.87rem;line-height:1.6;resize:vertical;outline:none;transition:border .2s;color:#1a1a2e;background:#fafdff;}
textarea:focus{border-color:var(--c);background:#fff;}
textarea[readonly]{background:#f5f7fa;color:#555;cursor:default;}
.qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:.6rem;gap:.5rem;flex-wrap:wrap;}
.wc{font-size:.72rem;color:#94a3b8;}
.foot-r{display:flex;align-items:center;gap:.6rem;}
.badge{display:none;align-items:center;gap:.35rem;border-radius:50px;padding:.28rem .85rem;font-size:.8rem;font-weight:800;white-space:nowrap;}
.b2{background:#E8F5E9;color:#1B5E20;border:1.5px solid #66BB6A;}
.b1{background:#FFF8E1;color:#E65100;border:1.5px solid #FFB300;}
.b0{background:#FFEBEE;color:#B71C1C;border:1.5px solid #EF5350;}
.vbtn{background:var(--c);color:#fff;border:none;padding:.4rem 1.1rem;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap;}
.vbtn:hover{background:var(--cd);}
.vbtn:disabled{background:#b0bec5;cursor:not-allowed;}
.model{display:none;margin-top:.9rem;background:var(--cl);border-left:3px solid var(--c);border-radius:8px;padding:.85rem 1rem;font-size:.82rem;line-height:1.7;color:#1B5E20;}
.mlbl{font-size:.63rem;font-weight:700;text-transform:uppercase;opacity:.7;margin-bottom:.35rem;letter-spacing:.06em;}
.cas{background:linear-gradient(135deg,#1B5E20,#2E7D32);color:#fff;border-radius:14px;padding:1.4rem;margin:1.6rem 0 .8rem;}
.cas h3{font-size:1rem;font-weight:700;margin-bottom:.5rem;}
.cas p,.cas li{font-size:.85rem;opacity:.9;line-height:1.7;}
.cas ul{margin:.4rem 0 0 1rem;}
.cas li{margin-bottom:.2rem;}
.sub-btn{display:block;width:100%;padding:.95rem;background:var(--c);color:#fff;font-weight:800;font-size:1rem;border:none;border-radius:12px;cursor:pointer;transition:.2s;margin-top:1.5rem;}
.sub-btn:hover{background:var(--cd);}
.results{display:none;background:#fff;border-radius:16px;padding:1.8rem;margin-top:1.5rem;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center;border:2.5px solid var(--c);}
.fscore{font-size:3.5rem;font-weight:900;color:var(--c);line-height:1;}
.fmax{font-size:1.1rem;color:#94a3b8;margin:.3rem 0 .5rem;}
.flbl{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;}
.breakdown{text-align:left;margin-top:.5rem;}
.bdi{display:flex;justify-content:space-between;align-items:center;padding:.4rem 0;border-bottom:1px solid #f0f0f0;font-size:.83rem;}
.bdi:last-child{border-bottom:none;}
.bdi-q{color:#555;flex:1;padding-right:.5rem;}
.restart{margin-top:1.2rem;padding:.7rem 2rem;background:var(--c);color:#fff;font-weight:700;border:none;border-radius:8px;cursor:pointer;font-size:.9rem;}
.restart:hover{background:var(--cd);}

/* ══ PREMIUM UPGRADE : FEUILLE BLANCHE ══ */
.hdr{
  backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 2px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)!important;
  border-bottom:1px solid rgba(255,255,255,.1);}
.back{transition:background .2s,transform .2s!important;}
.back:hover{background:rgba(255,255,255,.32)!important;transform:translateX(-2px);}
.tbtn{transition:background .15s,transform .15s!important;}
.tbtn:hover{background:rgba(255,255,255,.32)!important;transform:scale(1.06);}
.schip{backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.15)!important;}
.sec{border-left:none!important;padding-left:0!important;display:flex!important;align-items:center;gap:.5rem;}
.sec::before{content:'';display:inline-block;width:3px;height:12px;background:var(--c);border-radius:2px;flex-shrink:0;}
.intro{border-left:none!important;border:1px solid color-mix(in srgb,var(--c) 20%,transparent)!important;
  box-shadow:0 2px 12px color-mix(in srgb,var(--c) 10%,rgba(0,0,0,.04))!important;}
.qcard{box-shadow:0 2px 12px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04)!important;
  transition:box-shadow .22s,transform .22s,border-color .22s,background .22s!important;}
.qcard:hover{box-shadow:0 6px 22px color-mix(in srgb,var(--c) 15%,rgba(0,0,0,.05))!important;transform:translateY(-1px);}
.qcard.verified{border-color:var(--c)!important;background:color-mix(in srgb,var(--c) 3%,#fff)!important;
  box-shadow:0 4px 20px color-mix(in srgb,var(--c) 18%,rgba(0,0,0,.04))!important;}
textarea{transition:border-color .2s,box-shadow .2s!important;}
textarea:focus{border-color:var(--c)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent),0 2px 8px rgba(0,0,0,.06)!important;background:#fff!important;}
.vbtn{transition:background .18s,transform .18s,box-shadow .18s!important;
  box-shadow:0 2px 8px color-mix(in srgb,var(--c) 28%,transparent)!important;}
.vbtn:hover:not(:disabled){transform:translateY(-2px)!important;
  box-shadow:0 6px 18px color-mix(in srgb,var(--c) 36%,transparent)!important;}
@keyframes badgePop{0%{transform:scale(.55);opacity:0}65%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.badge[style*="flex"]{animation:badgePop .28s cubic-bezier(.4,0,.2,1) both!important;}
@keyframes modelIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.model[style*="block"]{animation:modelIn .24s cubic-bezier(.4,0,.2,1) both!important;}
.model{border-left:none!important;box-shadow:0 2px 10px color-mix(in srgb,var(--c) 12%,rgba(0,0,0,.04))!important;}
.cas{box-shadow:0 6px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.1)!important;}
.sub-btn{transition:background .18s,transform .18s,box-shadow .18s!important;
  box-shadow:0 4px 16px color-mix(in srgb,var(--c) 35%,transparent)!important;}
.sub-btn:hover{transform:translateY(-3px)!important;
  box-shadow:0 10px 30px color-mix(in srgb,var(--c) 42%,transparent)!important;}
@keyframes resultsIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.results[style*="block"]{animation:resultsIn .35s cubic-bezier(.4,0,.2,1) both!important;
  box-shadow:0 8px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06)!important;}
.fscore{text-shadow:0 4px 16px color-mix(in srgb,var(--c) 28%,transparent);}
.restart{transition:background .18s,transform .18s,box-shadow .18s!important;
  box-shadow:0 3px 12px color-mix(in srgb,var(--c) 28%,transparent)!important;}
.restart:hover{transform:translateY(-2px)!important;
  box-shadow:0 8px 22px color-mix(in srgb,var(--c) 36%,transparent)!important;}
@media(prefers-reduced-motion:reduce){
  .qcard,.vbtn,.sub-btn,.restart,.tbtn,.back{transition:none!important;}
  .badge,.model,.results{animation:none!important;}
}
</style>
<style>
/* ══ MOBILE FIRST ══ */
@media(max-width:640px){
  /* Header : compresser pour tenir sur une ligne */
  .hdr{padding:.65rem .9rem;gap:.4rem;}
  .htitle{font-size:.85rem;}
  .hsub{display:none;}           /* masquer le sous-titre sur mobile */
  .back{padding:.26rem .55rem;font-size:.7rem;}
  .hdr-l{gap:.5rem;}
  .hdr-r{gap:.35rem;}
  .timer{font-size:.95rem;}
  .tbtn{padding:.22rem .5rem;font-size:.7rem;}
  .schip{font-size:.72rem;padding:.22rem .65rem;}

  /* Body */
  .body{padding:.85rem .85rem 3rem;}

  /* Intro */
  .intro{font-size:.78rem;padding:.65rem .85rem;margin-bottom:1.1rem;}

  /* Libellé section */
  .sec{font-size:.6rem;margin:1.4rem 0 .7rem;}

  /* Carte question */
  .qcard{padding:.85rem .85rem .7rem;}
  .qlbl{font-size:.58rem;}
  .qtxt{font-size:.88rem;margin-bottom:.65rem;}
  textarea{font-size:.82rem;min-height:70px;padding:.55rem .75rem;}

  /* Footer question */
  .qfoot{gap:.3rem;}
  .wc{font-size:.68rem;}
  .foot-r{gap:.35rem;}
  .vbtn{padding:.33rem .8rem;font-size:.74rem;}
  .badge{font-size:.7rem;padding:.2rem .6rem;}

  /* Réponse modèle */
  .model{font-size:.76rem;padding:.65rem .8rem;margin-top:.75rem;}
  .mlbl{font-size:.58rem;}

  /* Cas pratique */
  .cas{padding:.9rem;border-radius:12px;margin:1.2rem 0 .7rem;}
  .cas h3{font-size:.88rem;}
  .cas p,.cas li{font-size:.77rem;}

  /* Bouton soumettre */
  .sub-btn{font-size:.9rem;padding:.8rem;border-radius:10px;}

  /* Panneau résultats */
  .results{padding:1.2rem;}
  .fscore{font-size:2.8rem;}
  .fmax{font-size:.88rem;}
  .flbl{font-size:.92rem;margin-bottom:.9rem;}
  .bdi{font-size:.76rem;padding:.35rem 0;}
  .bdi-q{font-size:.76rem;}
  .restart{font-size:.82rem;padding:.55rem 1.4rem;}
}
</style>

<script>
const POOL=[
  // UX DESIGN
  {id:'ux1',sec:'UX Design',prof:'Prof. Prévotat Ewane',q:'Définissez l\'UX Design. Quels sont ses 5 principes fondamentaux ?',kw:['ux','user experience','expérience utilisateur','utilisabilité','accessibilité','désirabilité','crédibilité','utilité','utilisateur','besoins','satisfaction'],model:'L\'<strong>UX Design</strong> (User Experience) = discipline visant à concevoir des produits utilisables, accessibles, désirables, utiles et crédibles. <strong>5 principes :</strong> Utilisabilité · Accessibilité · Désirabilité · Crédibilité · Utilité. Centrée sur les besoins réels de l\'utilisateur pour maximiser sa satisfaction.'},
  {id:'ux2',sec:'UX Design',prof:'Prof. Prévotat Ewane',q:'Qu\'est-ce qu\'un User Persona ? Comment le construire et à quoi sert-il ?',kw:['persona','utilisateur fictif','fictif','données','âge','profession','objectifs','frustrations','comportements','cibles','décisions','empathie'],model:'Un <strong>User Persona</strong> = profil utilisateur fictif basé sur des données réelles (interviews, analytics). Il incarne un segment cible. <strong>Construction :</strong> âge, profession, objectifs, frustrations, comportements, contexte. <strong>Utilité :</strong> orienter les décisions de design, créer de l\'empathie, aligner les équipes.'},
  {id:'ux3',sec:'UX Design',prof:'Prof. Prévotat Ewane',q:'Quelles sont les étapes du processus UX Design (Design Thinking) ? Décrivez chacune.',kw:['empathiser','définir','idéer','prototyper','tester','design thinking','itératif','observer','problème','solutions','maquette','feedback'],model:'Le <strong>Design Thinking</strong> (5 étapes) : 1. <strong>Empathiser</strong> (observer, interviewer). 2. <strong>Définir</strong> le problème. 3. <strong>Idéer</strong> des solutions créatives. 4. <strong>Prototyper</strong> (maquettes basse/haute fidélité). 5. <strong>Tester</strong> avec de vrais utilisateurs. Processus <strong>itératif</strong> : retour en arrière possible à chaque étape.'},
  {id:'ux4',sec:'UX Design',prof:'Prof. Prévotat Ewane',q:'Définissez le User Journey Map. Quelles informations y trouve-t-on ?',kw:['user journey','parcours','étapes','points de contact','touchpoints','émotions','pain points','opportunités','expérience','moments','actions'],model:'Le <strong>User Journey Map</strong> = représentation visuelle du parcours d\'un utilisateur de bout en bout. <strong>Contenu :</strong> étapes du parcours, points de contact (touchpoints), actions de l\'utilisateur, émotions/ressentis, pain points identifiés, opportunités d\'amélioration.'},
  {id:'ux5',sec:'UX Design',prof:'Prof. Prévotat Ewane',q:'Quels outils utilise-t-on pour tester l\'UX d\'un produit ? Citez 5 méthodes.',kw:['test utilisateur','a/b test','heatmap','eye tracking','questionnaire','nps','sus','card sorting','arbre','analytics','hotjar','ga4'],model:'• <strong>Tests utilisateurs</strong> (modérés ou non modérés). • <strong>A/B Testing.</strong> • <strong>Heatmaps & Click tracking</strong> (Hotjar). • <strong>Eye tracking.</strong> • <strong>Questionnaires</strong> (NPS, SUS). • <strong>Card Sorting</strong> (architecture de l\'information). • Analytics comportementaux (GA4).'},
  // UI DESIGN
  {id:'ui1',sec:'UI Design',prof:'Prof. Beghin Michael',q:'Quelle est la différence entre UX et UI Design ? Expliquez leur complémentarité.',kw:['ux','ui','expérience','interface','apparence','visuel','utilisabilité','couleurs','typographie','boutons','fonctionnel','beau','ressenti'],model:'<strong>UX Design :</strong> comment le produit fonctionne et ce que l\'utilisateur ressent (structure, parcours, utilisabilité). <strong>UI Design :</strong> comment le produit apparaît (couleurs, typographie, boutons, animations). <strong>Complémentarité :</strong> UX = la structure, UI = l\'habillage. Un bon produit doit être à la fois fonctionnel (UX) et beau/cohérent (UI).'},
  {id:'ui2',sec:'UI Design',prof:'Prof. Beghin Michael',q:'Quels sont les principes d\'un bon design de System Design (Design System) ?',kw:['design system','composants','bibliothèque','cohérence','réutilisable','typographie','couleurs','grille','espacements','tokens','figma','storybook'],model:'Un <strong>Design System</strong> = bibliothèque de composants UI réutilisables + règles de design. <strong>Éléments :</strong> Tokens (couleurs, typographies, espacements, grilles) · Composants réutilisables (boutons, cartes, formulaires) · Documentation. <strong>Bénéfices :</strong> cohérence visuelle, gain de temps, scalabilité. Outils : Figma, Storybook.'},
  {id:'ui3',sec:'UI Design',prof:'Prof. Beghin Michael',q:'Quels sont les principes fondamentaux du design d\'interface (lois UI) ? Citez-en 5.',kw:['hick','fitts','gestalt','proximité','similarité','contraste','hiérarchie','jakob','78%','moins de clics','charge cognitive'],model:'• <strong>Loi de Hick :</strong> + d\'options = + de temps décision → simplifier. • <strong>Loi de Fitts :</strong> cibles grandes et proches = + facile à cliquer. • <strong>Gestalt (Proximité, Similarité) :</strong> éléments proches = perçus ensemble. • <strong>Loi de Jakob :</strong> 78% du temps sur d\'autres sites → respecter les conventions. • <strong>Réduire la charge cognitive.</strong>'},
  {id:'ui4',sec:'UI Design',prof:'Prof. Beghin Michael',q:'Qu\'est-ce que l\'accessibilité numérique (WCAG) ? Citez ses 4 principes.',kw:['wcag','accessibilité','perceptible','opérable','compréhensible','robuste','handicap','contraste','alt','clavier','lecteur écran','aa'],model:'Les <strong>WCAG</strong> (Web Content Accessibility Guidelines) définissent les standards d\'accessibilité numérique. <strong>4 principes (POUR) :</strong> Perceptible (contenu visible, alt text, contraste) · Opérable (navigation au clavier) · Compréhensible (langage clair) · Robuste (compatible lecteurs d\'écran). Niveau minimum : <strong>AA.</strong>'},
  {id:'ui5',sec:'UI Design',prof:'Prof. Beghin Michael',q:'Comment concevoir un formulaire en ligne optimal ? Citez 6 règles UX/UI.',kw:['champs','labels','erreurs','validation','progression','mobile','44px','auto-complétion','cta','confirmation','longueur','guidé'],model:'• Labels explicites au-dessus des champs. • Validation en temps réel (feedback immédiat). • Messages d\'erreur clairs et positionnés. • Indicateur de progression (multi-étapes). • Mobile-first (44px min, claviers adaptés). • Auto-complétion activée. • CTA unique et visible. • Confirmation post-soumission.'},
  // MÉTHODES AGILES
  {id:'ag1',sec:'Méthodes Agiles',prof:'Prof. Picone Vincenza',q:'Qu\'est-ce que le Manifeste Agile ? Quand a-t-il été rédigé et quelles sont ses 4 valeurs fondamentales ?',kw:['manifeste agile','2001','individus','interactions','logiciel','collaboration','client','adaptation','changement','processus','outils','documentation','contrat'],model:'Le <strong>Manifeste Agile</strong> a été rédigé en <strong>2001</strong> par 17 développeurs. Il pose 4 valeurs : <strong>Individus et interactions</strong> &gt; processus et outils · <strong>Logiciel fonctionnel</strong> &gt; documentation exhaustive · <strong>Collaboration avec le client</strong> &gt; négociation contractuelle · <strong>Adaptation au changement</strong> &gt; suivi d\'un plan. Décliné en 12 principes.'},
  {id:'ag2',sec:'Méthodes Agiles',prof:'Prof. Picone Vincenza',q:'Comparez Scrum et Kanban. Quels contextes favorisent chacune de ces méthodes ?',kw:['scrum','kanban','sprint','itération','backlog','product owner','scrum master','tableau','flux','wip','limite','continue','livraison'],model:'<strong>Scrum :</strong> sprints fixes (1-4 sem.), équipe dédiée, rôles formels (PO, Scrum Master), cérémoniaux structurés. Idéal pour projets avec feuille de route définie. <strong>Kanban :</strong> flux continu, tableau visuel, limitation du WIP (Work In Progress), pas de sprints ni rôles fixes. Idéal pour maintenance, flux continu de tâches.'},
  {id:'ag3',sec:'Méthodes Agiles',prof:'Prof. Picone Vincenza',q:'Qu\'est-ce qu\'un Sprint en Scrum ? Décrivez les 4 cérémonies principales.',kw:['sprint','2 semaines','planning','daily','review','retrospective','backlog','objectif','équipe','incrément','démonstration'],model:'Un <strong>Sprint</strong> = itération courte et fixe (souvent 2 semaines) avec un objectif défini. <strong>4 cérémonies :</strong> 1. <strong>Sprint Planning :</strong> sélection des user stories. 2. <strong>Daily Standup :</strong> synchro quotidienne 15 min. 3. <strong>Sprint Review :</strong> démonstration au client. 4. <strong>Rétrospective :</strong> amélioration du processus.'},
  {id:'ag4',sec:'Méthodes Agiles',prof:'Prof. Picone Vincenza',q:'Qu\'est-ce qu\'une User Story ? Donnez sa structure et un exemple.',kw:['user story','en tant que','je veux','afin de','critères d\'acceptation','backlog','priorité','estimation','points','mvp'],model:'Une <strong>User Story</strong> = description fonctionnelle du point de vue de l\'utilisateur. <strong>Structure :</strong> "En tant que [utilisateur], je veux [action] afin de [bénéfice]." Ex : "En tant qu\'acheteur, je veux filtrer par taille afin de trouver rapidement mon produit." Accompagnée de <strong>critères d\'acceptation</strong> et estimée en story points.'},
  {id:'ag5',sec:'Méthodes Agiles',prof:'Prof. Picone Vincenza',q:'Qu\'est-ce qu\'un MVP ? Pourquoi est-il central dans une démarche agile ?',kw:['mvp','minimum viable product','fonctionnalités','essentielles','tester','marché','feedback','pivot','itérer','risque','lean','startup'],model:'Le <strong>MVP (Minimum Viable Product)</strong> = version minimale d\'un produit avec les fonctionnalités essentielles pour tester une hypothèse sur le marché. <strong>Pourquoi :</strong> réduire le risque, obtenir du feedback réel rapidement, itérer selon les retours. Principe <strong>Lean Startup</strong> : Build → Measure → Learn.'}
];

const CAS={ctx:'<strong>Moveo</strong> — start-up parisienne (2022), app mobile B2C de réservation de cours de sport (salle, home, outdoor). Levée seed <strong>450 k€</strong> · 140 partenaires sportifs · modèle freemium → abonnement <strong>9,99 €/mois</strong> + commission 15 % par réservation · 8 personnes (3 dev, 1 UX/UI, 1 PO, 2 sales, 1 CEO).<br><br><strong>Chiffres clés :</strong> 14 200 téléchargements · MAU <strong>2 100</strong> (14,8 %) · MRR <strong>28 k€</strong> · rétention J7 <strong>22 %</strong> (obj. 50 %) · rétention J30 <strong>8 %</strong> · abandon onboarding <strong>68 %</strong> · score SUS <strong>48/100</strong>.<br><br><strong>Funnel onboarding :</strong> téléchargement → compte 72 % → profil (14 champs !) 48 % → 1ère recherche 38 % → 1ère réservation 32 % → J7 22 % → J30 8 %.<br><br><strong>Problèmes identifiés :</strong> formulaire 14 champs (100 % des testeurs en difficulté) · recherche cours non intuitive · 0 recommandation personnalisée · paiement 3 étapes (CVR 58 %) · 4 polices dans l\'app · chargement 3,2 s (bench &lt;1,5 s) · WCAG 2/12 critères · 4 bugs critiques en prod (crash paiement : 12 % des transactions) · 2 sprints ratés · time to market 6 sem (obj. 2 sem).<br><br><strong>Objectifs 6 mois :</strong> abandon &lt;25 % · J7 50 % · J30 25 % · MAU 8 000 · MRR 75 k€ · SUS &gt;70.',q:'Proposez un plan de refonte UX/UI de l\'application Moveo et un plan d\'adoption Scrum. Détaillez les 3 priorités UX à traiter en sprint 1, proposez l\'organisation de l\'équipe (backlog, cérémonies, rôles) et fixez des KPI intermédiaires à S+4 et S+12.',kw:['onboarding','formulaire','friction','user test','persona','journey map','wireframe','prototype','design system','accessibilité','wcag','sprint','backlog','moscow','scrum','daily','rétrospective','vélocité','sus','push notification','paiement','recommandation','kpi'],model:'<strong>Sprint 1 — 3 priorités UX :</strong> (1) Onboarding : réduire à 4 champs (email + mdp + sport + niveau), progression visuelle 3 étapes, accès "explorer sans compte". KPI : abandon &lt;30% à S+2. (2) Recherche cours : filtres facettés (sport/lieu/créneau/niveau), carte interactive. KPI : 1ère réservation &gt;50% à S+4. (3) Paiement : 1 écran, Apple Pay / Google Pay, progress bar. KPI : CVR paiement &gt;85%. <strong>Design System :</strong> 1 police (Inter), palette 3 couleurs, composants réutilisables (boutons, cartes cours, badges). WCAG AA : contraste &gt;4,5:1, zones tactiles 44px min. KPI : SUS &gt;68 à S+6. <strong>Organisation Scrum :</strong> PO (CEO), Scrum Master (PO actuel), équipe dev (3). Cérémonies : daily 15 min, sprint review vendredi, rétro bi-mensuelle. Backlog MoSCoW : Must (onboarding, paiement, push notifs) · Should (recommandations, profil enrichi) · Could (social, gamification). KPI S+4 : 0 bug critique, SUS &gt;58, time to market &lt;3 sem. KPI S+12 : J7 &gt;40%, J30 &gt;20%, MAU &gt;5 000.'};

const QUOTA={'UX Design':2,'UI Design':2,'Méthodes Agiles':2};
const BADGE={2:{cls:'b2',icon:'✅',lbl:'2/2 · Très bien'},1:{cls:'b1',icon:'🟡',lbl:'1/2 · Bien'},0:{cls:'b0',icon:'❌',lbl:'0/2 · Insuffisant'}};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function score(text,kw){if(!text||norm(text).length<10)return 0;const n=norm(text);let f=0;kw.forEach(k=>{if(n.includes(norm(k)))f++;});const r=f/kw.length;return r>=0.55?2:r>=0.25?1:0;}

let selected=[],scores={};

function pickQ(){
  const bySec={};
  POOL.forEach(q=>{if(!bySec[q.sec])bySec[q.sec]=[];bySec[q.sec].push(q);});
  const out=[];
  Object.entries(QUOTA).forEach(([s,n])=>{out.push(...shuffle(bySec[s]||[]).slice(0,n));});
  return out;
}

function render(){
  selected=pickQ();
  scores={};
  const body=document.getElementById('examBody');
  document.getElementById('hsub').textContent=`Mercredi · ${selected.length+1} questions · Score sur ${(selected.length+1)*2} pts`;
  let html=`<div class="intro">📝 <strong>Questionnaire noté &amp; aléatoire</strong> : Nouveau tirage à chaque ouverture. Répondez sans notes, cliquez <em>Vérifier</em> par question ou <em>Remettre la copie</em> à la fin.</div>`;
  let lastSec='';
  selected.forEach((q,i)=>{
    if(q.sec!==lastSec){html+=`<div class="sec">${q.sec} · ${q.prof}</div>`;lastSec=q.sec;}
    html+=`<div class="qcard" id="card_${q.id}"><div class="qlbl">Question ${i+1} · 2 pts</div><div class="qtxt">${q.q}</div><textarea id="ta_${q.id}" placeholder="Rédigez votre réponse ici…"></textarea><div class="qfoot"><span class="wc" id="wc_${q.id}">0 mot</span><div class="foot-r"><div class="badge" id="badge_${q.id}"></div><button class="vbtn" id="vbtn_${q.id}" onclick="verifyOne('${q.id}')">Vérifier</button></div></div><div class="model" id="model_${q.id}"><div class="mlbl">Réponse attendue</div>${q.model}</div></div>`;
  });
  html+=`<div class="sec">Cas Pratique : Moveo</div><div class="cas"><h3>📋 Contexte</h3><p>${CAS.ctx}</p></div><div class="qcard" id="card_cas"><div class="qlbl">Question ${selected.length+1} : Étude de cas · 2 pts</div><div class="qtxt">${CAS.q}</div><textarea id="ta_cas" style="min-height:160px;" placeholder="Développez votre plan ici…"></textarea><div class="qfoot"><span class="wc" id="wc_cas">0 mot</span><div class="foot-r"><div class="badge" id="badge_cas"></div><button class="vbtn" id="vbtn_cas" onclick="verifyOne('cas')">Vérifier</button></div></div><div class="model" id="model_cas"><div class="mlbl">Correction indicative</div>${CAS.model}</div></div>`;
  html+=`<button class="sub-btn" onclick="submitAll()">📊 Remettre la copie · Voir mon score</button><div class="results" id="results"></div>`;
  body.innerHTML=html;
  [...selected.map(q=>q.id),'cas'].forEach(id=>{
    document.getElementById('ta_'+id)?.addEventListener('input',()=>{
      const w=(document.getElementById('ta_'+id).value.trim().split(/\s+/).filter(Boolean).length);
      document.getElementById('wc_'+id).textContent=w+(w<=1?' mot':' mots');
      if(!timerRunning)toggleTimer();
    });
  });
}

function verifyOne(id){
  const q=id==='cas'?CAS:selected.find(x=>x.id===id);
  const ta=document.getElementById('ta_'+id);
  const s=score(ta.value,q.kw);
  scores[id]=s;ta.readOnly=true;
  const b=BADGE[s];
  const bd=document.getElementById('badge_'+id);
  bd.className='badge '+b.cls;bd.textContent=b.icon+' '+b.lbl;bd.style.display='flex';
  document.getElementById('model_'+id).style.display='block';
  const vbtn=document.getElementById('vbtn_'+id);
  vbtn.textContent='✓ Vérifié';vbtn.disabled=true;
  document.getElementById('card_'+id).classList.add('verified');
  updateChip();
}

function updateChip(){
  const tot=Object.values(scores).reduce((a,b)=>a+b,0);
  const chip=document.getElementById('schip');chip.style.display='inline-block';
  chip.textContent=tot+' / '+((selected.length+1)*2);
}

function submitAll(){
  [...selected.map(q=>q.id),'cas'].forEach(id=>{if(scores[id]===undefined)verifyOne(id);});
  const tot=Object.values(scores).reduce((a,b)=>a+b,0);
  const max=(selected.length+1)*2;
  const pct=Math.round(tot/max*100);
  const grade=pct>=80?'🏆 Excellent !':pct>=60?'👍 Bien !':pct>=40?'📚 À consolider':'⚠️ À retravailler';
  let bd='';
  selected.forEach((q,i)=>{const s=scores[q.id]??0;const b=BADGE[s];bd+=`<div class="bdi"><span class="bdi-q">Q${i+1} · ${q.sec}</span><span class="badge ${b.cls}" style="display:inline-flex;font-size:.75rem;">${b.icon} ${s}/2</span></div>`;});
  const cs=scores['cas']??0;const cb=BADGE[cs];bd+=`<div class="bdi"><span class="bdi-q">Cas pratique</span><span class="badge ${cb.cls}" style="display:inline-flex;font-size:.75rem;">${cb.icon} ${cs}/2</span></div>`;
  const res=document.getElementById('results');
  res.style.display='block';
  res.innerHTML=`<div class="fscore">${tot}</div><div class="fmax">/ ${max} points · ${pct}%</div><div class="flbl">${grade}</div><div class="breakdown">${bd}</div><button class="restart" onclick="location.reload()">🔄 Nouveau questionnaire</button>`;
  res.scrollIntoView({behavior:'smooth'});
}

let timerRunning=false,timerSecs=0,timerInt;
function toggleTimer(){if(timerRunning){clearInterval(timerInt);timerRunning=false;document.getElementById('tbtn').textContent='▶';}else{timerInt=setInterval(()=>{timerSecs++;document.getElementById('timer').textContent=String(Math.floor(timerSecs/60)).padStart(2,'0')+':'+String(timerSecs%60).padStart(2,'0');},1000);timerRunning=true;document.getElementById('tbtn').textContent='⏸';}}
function resetTimer(){clearInterval(timerInt);timerRunning=false;timerSecs=0;document.getElementById('timer').textContent='00:00';document.getElementById('tbtn').textContent='▶';}

render();
</script>
</body>
</html>
